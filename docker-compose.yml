version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  ai-engine:
    build: ./ai-engine
    container_name: ai-engine
    ports:
      - "8000:8000"
    env_file:
      - ./ai-engine/.env

  backend-gateway:
    build: ./backend-gateway
    container_name: backend-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - PYTHON_SERVICE_URL=http://ai-engine:8000
    depends_on:
      - redis
      - ai-engine

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-gateway
